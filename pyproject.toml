[project]
name = "coldfront-plugin-dfg-fachsystematik"
version = "0.1.0"
description = "ColdFront plugin to classify projects with the DFG Fachsystematik (2024-2028)"
readme = "README.md"
authors = [
    { name = "York Schickl", email = "york.schickl@uni-konstanz.de" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Include the bundled Fachsystematik CSV as package data.
namespace = false

[tool.ruff]
# Keep in sync with requires-python.
target-version = "py312"
# Generated by Django; not worth hand-tuning. Exclude Markdown so the
# formatter does not rewrite Python snippets in the README.
extend-exclude = ["migrations", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
# The formatter enforces line length where it can; long strings and
# docstrings are left alone rather than mangled to fit.
ignore = ["E501"]
# Typographic characters used intentionally in German labels and range
# notation (2024–2028, hierarchy separators).
allowed-confusables = ["–", "›", "…"]

[tool.pytest.ini_options]
testpaths = ["tests"]
